<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netso — browser access</title>
<link rel="stylesheet" href="vendor/xterm.min.css">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1117; color: #c9d1d9; font: 13px/1.5 -apple-system, system-ui, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: #161b22; border-bottom: 1px solid #30363d; }
  header .title { font-weight: 700; letter-spacing: .04em; color: #e6edf3; margin-right: 8px; }
  header input, header select { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 5px 8px; font: inherit; }
  header select { min-width: 160px; }
  header button { background: #238636; border: 0; color: #fff; border-radius: 6px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  header button.secondary { background: #30363d; }
  header button:disabled { background: #30363d; color: #8b949e; cursor: default; }
  #status { margin-left: auto; color: #8b949e; font-variant-numeric: tabular-nums; }
  #status.ok { color: #3fb950; } #status.err { color: #f85149; }
  #terminal { padding: 8px; height: calc(100vh - 52px); }
  .hint { padding: 4px 14px 10px; color: #8b949e; background: #161b22; }
</style>
</head>
<body>
  <header>
    <span class="title">netso</span>
    <label>network <input id="network" value="prod" size="8"></label>
    <button id="refresh" class="secondary">List peers</button>
    <label>peer <select id="peer"></select></label>
    <button id="connect" disabled>Loading…</button>
    <span id="status">initializing</span>
  </header>
  <div class="hint">Browser access to a peer — the same Go Noise&nbsp;IK client as the CLI, compiled to WebAssembly. The peer's key is taken from discovery and pinned; the hub only relays ciphertext.</div>
  <div id="terminal"></div>

  <script src="vendor/xterm.min.js"></script>
  <script src="wasm_exec.js"></script>
  <script src="main.js"></script>
</body>
</html>
